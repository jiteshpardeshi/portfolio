name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/main.js
      - name: Check HTML parses
        run: python3 -c "from html.parser import HTMLParser; HTMLParser().feed(open('index.html',encoding='utf-8').read())"
      - name: Check JS syntax
        run: node --check js/main.js

  docker:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bloom-portfolio:test .
      - name: Smoke test
        run: |
          docker run -d -p 8080:80 --name site bloom-portfolio:test
          sleep 3
          curl -fsS http://localhost:8080 | grep -q "Jitesh"
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/bloom-portfolio
          docker tag bloom-portfolio:test $IMG:latest
          docker tag bloom-portfolio:test $IMG:${{ github.sha }}
          docker push $IMG --all-tags
